[project]
name = "aamcha-hishob"
version = "0.1.0"
description = "Aamcha Hishob: a sourced knowledge graph of Mumbai's civic spending and works."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "anthropic>=2.8",
    "boto3>=1.34",
    "fastapi>=0.115,<0.116",
    "httpx>=0.27",
    "jsonschema>=4.26.0",
    "neo4j>=5.28,<6",
    "psycopg-pool>=3.2",
    "psycopg[binary]>=3.2",
    "pymupdf>=1.24",
    "pyshacl>=0.40.2",
    "pyyaml>=6.0.3",
    "rdflib>=7.6.0",
    "uvicorn>=0.32,<0.33",
]

[project.scripts]
hishob = "hishob.cli:main"

[dependency-groups]
dev = [
    "moto[s3,sqs]>=5.0",
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.6",
    "types-jsonschema>=4.26.0.20261006",
    "types-pyyaml==6.0.12.20250915",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hishob"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # Starlette's test client uses an anyio alias that newer anyio deprecates; not our code.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]
markers = [
    "integration: needs a Postgres database (HISHOB_TEST_DATABASE_URL)",
    "live: calls the Claude API and costs money; runs only with HISHOB_LIVE=1",
    "graph: needs a graph database over Bolt (HISHOB_TEST_GRAPH_URI); it is wiped",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Devanagari zero is data here (Marathi and Hindi amounts), not a typo for the letter o.
allowed-confusables = ["०"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["hishob"]

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*", "pymupdf.*", "fitz.*"]
ignore_missing_imports = true

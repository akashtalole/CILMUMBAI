name: Docs

on:
  push:
    branches: [main]
    paths:
      - "**.md"
      - "mkdocs.yml"
      - "docs/**"
      - "docs-hooks/**"
      - "requirements-docs.txt"
      - ".github/workflows/docs.yml"
      - "app/src/hishob/rupee/**"
      - "app/src/hishob/api/rupee.py"
      - "app/web/src/**"
      - "app/datasets/**"
  pull_request:
    paths:
      - "**.md"
      - "mkdocs.yml"
      - "docs/**"
      - "docs-hooks/**"
      - "requirements-docs.txt"
      - ".github/workflows/docs.yml"
      - "aamcha-hishob-specs/tools/**"
      - "app/src/hishob/rupee/**"
      - "app/web/src/**"
      - "app/datasets/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

env:
  NO_MKDOCS_2_WARNING: "1"

jobs:
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: pip install -r requirements-docs.txt
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/web/package-lock.json
      - name: Build Follow the Rupee as a static site (no server, no API key)
        # Claude's notes come from the committed notes.json; any that no longer pass the checks become templates.
        run: |
          cd app
          uv sync --locked
          uv run hishob rupee build --notes datasets/follow-the-rupee/results/notes.json --out var/rupee
          uv run hishob rupee export --bundle var/rupee --out ../docs/rupee/json
          cd web && npm ci && npm run build:rupee && cp -r dist-rupee/. ../../docs/rupee/
      - name: Check spec traceability
        run: python aamcha-hishob-specs/tools/check_specs.py
      - run: mkdocs build --strict

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: pip install -r requirements-docs.txt
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/web/package-lock.json
      - name: Build Follow the Rupee as a static site (no server, no API key)
        # Claude's notes come from the committed notes.json; any that no longer pass the checks become templates.
        run: |
          cd app
          uv sync --locked
          uv run hishob rupee build --notes datasets/follow-the-rupee/results/notes.json --out var/rupee
          uv run hishob rupee export --bundle var/rupee --out ../docs/rupee/json
          cd web && npm ci && npm run build:rupee && cp -r dist-rupee/. ../../docs/rupee/
      - name: Publish to the gh-pages branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          mkdocs gh-deploy --strict --force --no-history

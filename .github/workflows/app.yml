name: App

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/app.yml"]
  pull_request:
    paths: ["app/**", ".github/workflows/app.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: hishob
          POSTGRES_DB: hishob_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      HISHOB_TEST_DATABASE_URL: postgresql://postgres:hishob@localhost:5432/hishob_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Lint and format
        run: uv run ruff check src tests && uv run ruff format --check src tests
      - name: Types
        run: uv run mypy
      - name: Ontology artefacts up to date (SPEC-002/R6)
        run: uv run hishob ontology build --check
      - name: Tests
        run: uv run pytest -q

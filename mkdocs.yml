site_name: Aamcha Hishob
site_description: Plans, architecture and starter code for a civic accountability platform for Mumbai, built for Claude Impact Lab Mumbai.
site_url: https://akashtalole.github.io/CILMUMBAI/
repo_url: https://github.com/akashtalole/CILMUMBAI
repo_name: akashtalole/CILMUMBAI
edit_uri: edit/main/

# docs/ holds symlinks to the folders at the repository root, so the files
# stay where they are and relative links between them keep working.
docs_dir: docs

exclude_docs: |
  __pycache__/
  *.pyc
  .orchestrator.sqlite*
  .entities.jsonl
  data/

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

plugins:
  - search

hooks:
  - docs-hooks/agent_config.py

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tasklist:
      custom_checkbox: true

